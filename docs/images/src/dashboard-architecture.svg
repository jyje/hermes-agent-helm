<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <!-- Source for docs/images/dashboard-architecture.png. Re-render with:
       rsvg-convert -w 1600 docs/images/src/dashboard-architecture.svg -o docs/images/dashboard-architecture.png -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#12203a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="880" fill="#070d1a"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="72" font-size="34" font-weight="700" fill="#f1f5f9">Web dashboard on Kubernetes</text>
  <text x="60" y="106" font-size="19" fill="#60a5fa">How the chart wires upstream Hermes' built-in dashboard behind an Ingress</text>

  <!-- ===== Browser ===== -->
  <rect x="60" y="300" width="220" height="190" rx="18" fill="#0d1729" stroke="#3b82f6" stroke-width="2"/>
  <rect x="90" y="330" width="160" height="96" rx="8" fill="#0a1222" stroke="#334155" stroke-width="1.5"/>
  <circle cx="104" cy="344" r="4" fill="#ef4444"/><circle cx="118" cy="344" r="4" fill="#f59e0b"/><circle cx="132" cy="344" r="4" fill="#22c55e"/>
  <rect x="100" y="360" width="140" height="10" rx="3" fill="#1e3a5f"/>
  <rect x="100" y="378" width="100" height="8" rx="3" fill="#1e293b"/>
  <rect x="100" y="394" width="120" height="8" rx="3" fill="#1e293b"/>
  <text x="170" y="455" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">Browser</text>
  <text x="170" y="478" font-size="15" fill="#94a3b8" text-anchor="middle">https://hermes.example.com</text>

  <!-- browser -> ingress -->
  <line x1="282" y1="395" x2="372" y2="395" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="327" y="383" font-size="14" fill="#93c5fd" text-anchor="middle">HTTPS</text>

  <!-- ===== Cluster boundary ===== -->
  <rect x="380" y="150" width="1160" height="500" rx="22" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="404" y="136" width="210" height="30" rx="15" fill="#0b1f4a" stroke="#1d4ed8" stroke-width="2"/>
  <text x="509" y="157" font-size="16" font-weight="700" fill="#93c5fd" text-anchor="middle">Kubernetes cluster</text>

  <!-- ===== Ingress ===== -->
  <rect x="410" y="300" width="230" height="190" rx="18" fill="#0d1729" stroke="#3b82f6" stroke-width="2"/>
  <text x="525" y="345" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">Ingress</text>
  <text x="525" y="368" font-size="14" fill="#94a3b8" text-anchor="middle">or Gateway API HTTPRoute</text>
  <rect x="432" y="386" width="186" height="30" rx="8" fill="#0a1222" stroke="#334155"/>
  <text x="525" y="406" font-size="14" fill="#cbd5e1" text-anchor="middle">TLS terminates here</text>
  <rect x="432" y="424" width="186" height="48" rx="8" fill="#0a1222" stroke="#334155"/>
  <text x="525" y="443" font-size="13" fill="#cbd5e1" text-anchor="middle">sends X-Forwarded-Proto</text>
  <text x="525" y="462" font-size="13" fill="#cbd5e1" text-anchor="middle">from the controller pod</text>

  <!-- ingress -> service -->
  <line x1="642" y1="395" x2="702" y2="395" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== Service ===== -->
  <rect x="710" y="340" width="150" height="110" rx="16" fill="#0d1729" stroke="#3b82f6" stroke-width="2"/>
  <text x="785" y="385" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">Service</text>
  <text x="785" y="412" font-size="15" fill="#60a5fa" text-anchor="middle">port 9119</text>
  <text x="785" y="432" font-size="13" fill="#94a3b8" text-anchor="middle">ClusterIP</text>

  <!-- service -> dashboard -->
  <line x1="862" y1="395" x2="932" y2="395" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== Pod ===== -->
  <rect x="940" y="190" width="560" height="440" rx="20" fill="#0b1426" stroke="#2dd4bf" stroke-width="2"/>
  <text x="966" y="226" font-size="20" font-weight="700" fill="#5eead4">Pod</text>
  <text x="1018" y="226" font-size="15" fill="#94a3b8">hermes-agent container · s6-overlay supervises both processes</text>

  <!-- dashboard process -->
  <rect x="964" y="250" width="250" height="250" rx="14" fill="#0d1b33" stroke="#3b82f6" stroke-width="2"/>
  <text x="1089" y="284" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle">hermes dashboard</text>
  <text x="1089" y="306" font-size="13" fill="#94a3b8" text-anchor="middle">listens on 0.0.0.0:9119</text>
  <rect x="980" y="322" width="218" height="74" rx="10" fill="#1a1405" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="1089" y="346" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">Auth gate (required)</text>
  <text x="1089" y="367" font-size="13" fill="#fde68a" text-anchor="middle">password, Nous Portal OAuth,</text>
  <text x="1089" y="385" font-size="13" fill="#fde68a" text-anchor="middle">or your OpenID Connect</text>
  <text x="1089" y="420" font-size="13" fill="#cbd5e1" text-anchor="middle">public_url, trusted_proxies</text>
  <text x="1089" y="439" font-size="13" fill="#cbd5e1" text-anchor="middle">from the chart's config.yaml</text>
  <text x="1089" y="470" font-size="13" fill="#94a3b8" text-anchor="middle">readiness: TCP 9119</text>

  <!-- gateway process -->
  <rect x="1236" y="250" width="240" height="250" rx="14" fill="#0d1b33" stroke="#2dd4bf" stroke-width="2"/>
  <text x="1356" y="284" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle">hermes gateway run</text>
  <text x="1356" y="306" font-size="13" fill="#94a3b8" text-anchor="middle">the agent itself</text>
  <text x="1356" y="350" font-size="14" fill="#cbd5e1" text-anchor="middle">messaging platforms,</text>
  <text x="1356" y="370" font-size="14" fill="#cbd5e1" text-anchor="middle">cron, tools, sessions</text>
  <text x="1356" y="420" font-size="13" fill="#94a3b8" text-anchor="middle">no inbound port</text>
  <text x="1356" y="439" font-size="13" fill="#94a3b8" text-anchor="middle">(outbound only)</text>

  <!-- shared volume -->
  <rect x="964" y="530" width="512" height="80" rx="14" fill="#0a1222" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="1220" y="563" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">PVC · HERMES_HOME (/opt/data)</text>
  <text x="1220" y="588" font-size="14" fill="#94a3b8" text-anchor="middle">config.yaml, .env, sessions, skills, memory, logs: shared by both</text>
  <line x1="1089" y1="502" x2="1089" y2="527" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowc)" marker-start="url(#arrowc)"/>
  <line x1="1356" y1="502" x2="1356" y2="527" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowc)" marker-start="url(#arrowc)"/>

  <!-- ===== outbound ===== -->
  <rect x="940" y="700" width="270" height="120" rx="16" fill="#0d1729" stroke="#f59e0b" stroke-width="2"/>
  <text x="1075" y="742" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle">LLM provider</text>
  <text x="1075" y="768" font-size="14" fill="#94a3b8" text-anchor="middle">OpenAI, Anthropic, NVIDIA,</text>
  <text x="1075" y="788" font-size="14" fill="#94a3b8" text-anchor="middle">OpenRouter, any compatible API</text>
  <rect x="1230" y="700" width="270" height="120" rx="16" fill="#0d1729" stroke="#f59e0b" stroke-width="2"/>
  <text x="1365" y="742" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle">Messaging platforms</text>
  <text x="1365" y="768" font-size="14" fill="#94a3b8" text-anchor="middle">Telegram, Discord, Slack,</text>
  <text x="1365" y="788" font-size="14" fill="#94a3b8" text-anchor="middle">Google Chat, ...</text>
  <path d="M1420 632 L1420 672 L1075 672 L1075 696" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowo)"/>
  <line x1="1420" y1="672" x2="1420" y2="696" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowo)"/>
  <text x="1436" y="666" font-size="13" fill="#fbbf24">outbound</text>

  <!-- ===== chart-managed legend (outside the cluster) ===== -->
  <rect x="60" y="690" width="840" height="150" rx="16" fill="#0d1729" stroke="#334155" stroke-width="1.5"/>
  <text x="84" y="722" font-size="17" font-weight="700" fill="#f1f5f9">What the chart renders</text>
  <text x="84" y="750" font-size="14" fill="#cbd5e1">dashboard.enabled  →  HERMES_DASHBOARD=1 + readiness</text>
  <text x="84" y="774" font-size="14" fill="#cbd5e1">service.enabled  →  Service on port 9119</text>
  <text x="84" y="798" font-size="14" fill="#cbd5e1">ingress / httpRoute  →  route to that Service</text>
  <text x="540" y="750" font-size="14" fill="#cbd5e1">dashboard.publicUrl / trustedProxies</text>
  <text x="560" y="774" font-size="14" fill="#cbd5e1">→  config.yaml on the PVC</text>
  <text x="540" y="798" font-size="14" fill="#cbd5e1">dashboard.auth.provider  →  checked at render</text>
  <text x="84" y="826" font-size="13" fill="#64748b">The dashboard itself is upstream Hermes (Nous Research); the chart only deploys and exposes it.</text>
</svg>
