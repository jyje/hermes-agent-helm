site_name: jyje/hermes-agent-helm
site_description: Community-powered Helm chart for running Hermes Agent on Kubernetes.
site_url: https://jyje.github.io/hermes-agent-helm/
repo_url: https://github.com/jyje/hermes-agent-helm
repo_name: jyje/hermes-agent-helm
docs_dir: docs

hooks:
  - hooks.py

theme:
  name: material
  logo: images/hermes-agent-helm.png
  palette:
    scheme: default
    primary: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit

edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header-title.js

plugins:
  - search
  - glightbox
  - macros:
      # This repo's docs document GitHub Actions (${{ }}) and Helm template
      # ({{ .Values.x }}) syntax verbatim in many pages: macros' Jinja
      # processing would mangle that literal text. Opt in per-page instead
      # of processing the whole site (see docs/chart/hermes-agent/examples
      # /index.md's `render_macros: true` frontmatter for the one page that
      # needs it).
      render_by_default: false
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Chart: 차트
            Hermes Agent: Hermes Agent
            Examples: 예제
            Chart reference: 차트 참고 자료
            Chart values: 차트 values
            Getting started: 시작하기
            Install: 설치
            Advanced: 고급 사용법
            # Was "공급자", inconsistent with "제공자" used everywhere in
            # the actual page bodies (READMEs, chart README, every example
            # page) - matched to the term readers actually see.
            Providers: 제공자
            Integrations: 통합
            Configuration model: 설정 모델
            Secrets and persistence: Secret과 영속성
            Operations and testing: 운영과 테스트
            Helm installation guide: Helm 설치 가이드
            Patterns: 실전 패턴
            Teams: Hermes 팀
            Setting up a team: Hermes 팀 구성하기
            Contributing: 기여하기
            CI guide: CI 가이드
            Hermes teams: Hermes 팀
            Hermes collaboration: Hermes 협업
            Roadmap: 로드맵
            DevOps roadmap: DevOps 로드맵
            Local development guide: 로컬 개발 가이드
            Helm installation guide: Helm 설치 가이드
            ArgoCD guide: ArgoCD 가이드
            Helm repository index: Helm 저장소 인덱스
            Chart README: 차트 README
            Security policy: 보안 정책
            Source documents: 소스 문서
            About: 정보

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # Python-Markdown's default slugify strips non-ASCII characters, so a
      # Korean-only heading (e.g. "라이브 증거") loses its whole slug and
      # falls back to an unstable, content-blind "_3"-style numeric id, and
      # a mixed heading silently drops just its Korean words. Unicode-aware
      # slugify keeps Korean characters, giving every KO heading a real,
      # stable anchor.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  # Without this, Markdown syntax inside raw HTML blocks (the <div
  # align="center">...</div> wrapper the READMEs use for their header) is
  # left as literal, unrendered text instead of being parsed: this is
  # standard Python-Markdown behavior, not an MkDocs quirk.
  - md_in_html

nav:
  - Home: index.md
  - Chart:
      - chart/index.md
      - Hermes Agent:
          - chart/hermes-agent/index.md
          - Examples: chart/hermes-agent/examples/index.md
          - Chart reference:
              - chart/hermes-agent/reference/index.md
              - Chart values: chart/hermes-agent/reference/values.md
              - Chart README: chart/hermes-agent/reference/readme.md
  - Getting started:
      - getting-started/index.md
      - Install: getting-started/install.md
  - Advanced:
      - advanced/index.md
      - Configuration model: advanced/configuration.md
      - Secrets and persistence: advanced/secrets-and-storage.md
      - Operations and testing: advanced/operations.md
      - Helm installation guide: advanced/helm-installation.md
      - Providers:
          - advanced/providers/index.md
          - Anthropic: advanced/providers/anthropic.md
          - DeepInfra: advanced/providers/deepinfra.md
          - Fireworks: advanced/providers/fireworks.md
          - Gemini: advanced/providers/gemini.md
          - GitHub Copilot: advanced/providers/github-copilot.md
          - Google Vertex: advanced/providers/google-vertex.md
          - NVIDIA NIM + Discord: advanced/providers/nvidia-nim-and-discord.md
          - OpenAI: advanced/providers/openai.md
          - OpenRouter: advanced/providers/openrouter.md
          - Upstage: advanced/providers/upstage.md
      - Integrations:
          - advanced/integrations/index.md
          - Anthropic + Discord: advanced/integrations/anthropic-and-discord.md
          - Ingress: advanced/integrations/ingress.md
          - LiteLLM: advanced/integrations/litellm.md
          - LiteLLM (in-cluster): advanced/integrations/litellm-k8s.md
          - OpenAI + Telegram: advanced/integrations/openai-and-telegram.md
      - Patterns:
          - advanced/patterns/index.md
          - Bitwarden Secrets Manager: advanced/patterns/bitwarden.md
          - Mixture-of-Agents: advanced/patterns/moa.md
          - Multi-agent collaboration: advanced/patterns/multi-agent-collab.md
          - Shared knowledge base: advanced/patterns/shared-knowledge.md
          - Team leader: advanced/patterns/team-leader.md
          - Team member: advanced/patterns/team-member.md
      - Teams:
          - Setting up a team: advanced/teams/index.md
          - Hermes teams: advanced/teams/reference.md
          - Hermes collaboration: advanced/teams/collaboration.md
      - ArgoCD guide: advanced/argocd.md
  - Contributing:
      - contributing/index.md
      - Local development guide: contributing/local-development.md
      - CI guide: contributing/ci.md
      - DevOps roadmap: contributing/devops-roadmap.md
  - About:
      - about/index.md
      - Helm repository index: about/helm-repository.md
      - Roadmap: about/roadmap.md
      - Security policy: about/security.md
      - Source documents: about/source-documents.md
