site_name: jyje/hermes-agent-helm
site_description: Community-powered Helm chart for running Hermes Agent on Kubernetes.
site_url: https://jyje.github.io/hermes-agent-helm/
repo_url: https://github.com/jyje/hermes-agent-helm
repo_name: jyje/hermes-agent-helm
docs_dir: docs

hooks:
  - hooks.py

theme:
  name: material
  logo: images/hermes-agent-helm.png
  palette:
    scheme: default
    primary: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit

edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header-title.js

plugins:
  - search
  - macros:
      # This repo's docs document GitHub Actions (${{ }}) and Helm template
      # ({{ .Values.x }}) syntax verbatim in many pages: macros' Jinja
      # processing would mangle that literal text. Opt in per-page instead
      # of processing the whole site (see docs/charts/hermes-agent/overlays
      # /index.md's `render_macros: true` frontmatter for the one page that
      # needs it).
      render_by_default: false
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Charts: 차트
            Hermes Agent: Hermes Agent
            Values overlays: Values 오버레이
            Chart values: 차트 values
            Getting started: 시작하기
            Install: 설치
            Examples: 예제
            # Was "공급자", inconsistent with "제공자" used everywhere in
            # the actual page bodies (READMEs, chart README, every example
            # page) - matched to the term readers actually see.
            Providers: 제공자
            Integrations: 통합
            Advanced: 고급
            Guides: 가이드
            Configuration model: 설정 모델
            Secrets and persistence: Secret과 영속성
            Operations and testing: 운영과 테스트
            Setting up a team: Hermes 팀 구성하기
            Reference: 참고 자료
            Contributing: 기여하기
            CI guide: CI 가이드
            Hermes teams: Hermes 팀
            Hermes collaboration: Hermes 협업
            Roadmap: 로드맵
            DevOps roadmap: DevOps 로드맵
            Local development guide: 로컬 개발 가이드
            Helm installation guide: Helm 설치 가이드
            ArgoCD guide: ArgoCD 가이드
            Helm repository index: Helm 저장소 인덱스
            Chart README: 차트 README
            Security policy: 보안 정책
            Source documents: 소스 문서

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # Python-Markdown's default slugify strips non-ASCII characters, so a
      # Korean-only heading (e.g. "라이브 증거") loses its whole slug and
      # falls back to an unstable, content-blind "_3"-style numeric id, and
      # a mixed heading silently drops just its Korean words. Unicode-aware
      # slugify keeps Korean characters, giving every KO heading a real,
      # stable anchor.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  # Without this, Markdown syntax inside raw HTML blocks (the <div
  # align="center">...</div> wrapper the READMEs use for their header) is
  # left as literal, unrendered text instead of being parsed: this is
  # standard Python-Markdown behavior, not an MkDocs quirk.
  - md_in_html

nav:
  - Home: index.md
  - Charts:
      - charts/index.md
      - Hermes Agent:
          - charts/hermes-agent/index.md
          - Install: charts/hermes-agent/install.md
          - Values overlays: charts/hermes-agent/overlays/index.md
          - Reference:
              - charts/hermes-agent/reference/index.md
              - Chart values: charts/hermes-agent/reference/values.md
  - Getting started:
      - getting-started/index.md
      - Install: getting-started/install.md
  - Examples:
      - examples/index.md
      - Providers:
          - examples/providers/index.md
          - Anthropic: examples/providers/anthropic.md
          - DeepInfra: examples/providers/deepinfra.md
          - Fireworks: examples/providers/fireworks.md
          - Gemini: examples/providers/gemini.md
          - GitHub Copilot: examples/providers/github-copilot.md
          - Google Vertex: examples/providers/google-vertex.md
          - NVIDIA NIM + Discord: examples/providers/nvidia-nim-and-discord.md
          - OpenAI: examples/providers/openai.md
          - OpenRouter: examples/providers/openrouter.md
          - Upstage: examples/providers/upstage.md
      - Integrations:
          - examples/integrations/index.md
          - Anthropic + Discord: examples/integrations/anthropic-and-discord.md
          - Ingress: examples/integrations/ingress.md
          - LiteLLM: examples/integrations/litellm.md
          - LiteLLM (in-cluster): examples/integrations/litellm-k8s.md
          - OpenAI + Telegram: examples/integrations/openai-and-telegram.md
      - Advanced:
          - examples/advanced/index.md
          - Bitwarden Secrets Manager: examples/advanced/bitwarden.md
          - Mixture-of-Agents: examples/advanced/moa.md
          - Multi-agent collaboration: examples/advanced/multi-agent-collab.md
          - Shared knowledge base: examples/advanced/shared-knowledge.md
          - Team leader: examples/advanced/team-leader.md
          - Team member: examples/advanced/team-member.md
  - Guides:
      - guides/index.md
      - Configuration model: guides/configuration.md
      - Secrets and persistence: guides/secrets-and-storage.md
      - Operations and testing: guides/operations.md
      - Setting up a team: guides/team-setup.md
  - Reference:
      - reference/index.md
      - Contributing: reference/contributing.md
      - CI guide: reference/ci.md
      - Hermes teams: reference/teams.md
      - Hermes collaboration: reference/collaboration.md
      - Roadmap: reference/roadmap.md
      - DevOps roadmap: reference/devops-roadmap.md
      - Local development guide: reference/local-development.md
      - Helm installation guide: reference/helm-installation.md
      - ArgoCD guide: reference/argocd.md
      - Helm repository index: reference/helm-repository.md
      - Chart README: reference/chart-readme.md
      - Security policy: reference/security.md
      - Source documents: reference/source-documents.md
