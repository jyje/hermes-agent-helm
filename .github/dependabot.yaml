# Dependabot configuration for automated dependency updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
    commit-message:
      prefix: "🤖 ci"
      prefix-development: "🤖 ci"
      include: "scope"

  # Helm charts
  - package-ecosystem: "helm"
    directories:
      - "/charts/*"
    schedule:
      interval: "weekly"
    # The device-login init container's Python tag is managed by
    # cron-fetch-image.yaml: it follows the Python that the pinned Hermes image
    # runs (upstream pm/lock.json). Do not let Dependabot move it ahead.
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]
    labels:
      - "github-actions"
    commit-message:
      prefix: "🤖 ci"
      prefix-development: "🤖 ci"
      include: "scope"
