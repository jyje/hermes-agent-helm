name: 🚀 release-chart

# Release model: Changesets creates a reviewed version PR, and its custom
# version step synchronizes the private release manifest with Chart.yaml.
# When that PR reaches `main`, CI tags it and publishes to GitHub Packages (OCI).
# CI never pushes to `main`: the tag/release/artifact are the only outputs.
on:
  push:
    branches: [main]
    paths: ["charts/hermes-agent/Chart.yaml"]

permissions:
  contents: write   # create tag + GitHub Release
  packages: write   # push to ghcr
  id-token: write   # mint a Sigstore OIDC token for keyless cosign signing
  actions: write    # trigger deploy-docs.yaml after updating the Helm repo data

jobs:
  release-chart:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed for the release guard

      - name: Resolve chart version
        id: ver
        run: |
          VER="$(grep -E '^version:' charts/hermes-agent/Chart.yaml | awk '{print $2}' | tr -d '"')"
          NAME="$(grep -E '^name:' charts/hermes-agent/Chart.yaml | awk '{print $2}' | tr -d '"')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "chart_name=$NAME" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VER already released - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Changesets changelog section for this version
        if: steps.ver.outputs.exists == 'false'
        run: |
          awk -v version="${{ steps.ver.outputs.version }}" '
            /^## / {
              if (found) exit
              heading = $0
              sub(/^##[[:space:]]+/, "", heading)
              sub(/^\[/, "", heading)
              sub(/\].*$/, "", heading)
              sub(/[[:space:]]+-.*$/, "", heading)
              if (heading == version) { found=1 }
              next
            }
            found { print }
          ' CHANGELOG.md > CHANGELOG_SECTION.md
          test -s CHANGELOG_SECTION.md || {
            echo "::error::No CHANGELOG.md section found for v${{ steps.ver.outputs.version }}"
            exit 1
          }

      - name: Render release notes
        if: steps.ver.outputs.exists == 'false'
        run: |
          bash .github/scripts/release/render-release-notes.sh \
            "${{ github.repository }}" "${{ steps.ver.outputs.chart_name }}" \
            "${{ steps.ver.outputs.version }}" CHANGELOG_SECTION.md \
            charts/hermes-agent/Chart.yaml \
            > RELEASE_NOTES.md

      - name: Create tag + GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.chart_name }} v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md

      - name: Ensure release title (action-gh-release may reuse a stale release without it)
        if: steps.ver.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.chart_name }} v${{ steps.ver.outputs.version }}"

      - name: Setup Helm
        if: steps.ver.outputs.exists == 'false'
        uses: azure/setup-helm@v5

      - name: Package & push to ghcr (OCI)
        if: steps.ver.outputs.exists == 'false'
        run: |
          helm package charts/hermes-agent --destination dist/
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/hermes-agent-*.tgz "oci://ghcr.io/${{ github.repository }}"

      - name: Install cosign
        if: steps.ver.outputs.exists == 'false'
        uses: sigstore/cosign-installer@v3

      - name: Log in to ghcr for cosign
        if: steps.ver.outputs.exists == 'false'
        # `helm registry login` above only writes Helm's own registry config;
        # cosign reads the Docker keychain (~/.docker/config.json). Without this
        # login cosign cannot push the signature and fails with UNAUTHORIZED.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign the chart (keyless, Sigstore)
        if: steps.ver.outputs.exists == 'false'
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}/${{ steps.ver.outputs.chart_name }}:${{ steps.ver.outputs.version }}"

      - name: Verify signature (self-check)
        if: steps.ver.outputs.exists == 'false'
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/${{ steps.ver.outputs.chart_name }}:${{ steps.ver.outputs.version }}"

      - name: Checkout existing Helm repo index (gh-pages)
        if: steps.ver.outputs.exists == 'false'
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-index

      - name: Build Helm repo index
        if: steps.ver.outputs.exists == 'false'
        run: |
          mkdir -p .deploy
          cp dist/hermes-agent-*.tgz .deploy/
          if [ -f gh-pages-index/index.yaml ]; then
            helm repo index .deploy --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} \
              --merge gh-pages-index/index.yaml
          else
            helm repo index .deploy --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          fi

      # gh-pages is a plain data store for the Helm chart repository here, not
      # the Pages source: Pages itself is deployed by deploy-docs.yaml via
      # actions/deploy-pages. keep_files preserves every prior release's .tgz
      # that isn't part of this run's .deploy/ dir.
      - name: Publish Helm repo data to the gh-pages branch
        if: steps.ver.outputs.exists == 'false'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Trigger a Pages deployment with the new release
        if: steps.ver.outputs.exists == 'false'
        run: gh workflow run deploy-docs.yaml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
