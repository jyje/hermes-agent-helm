name: 📚 deploy-docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "README-ko.md"
      - "SECURITY.md"
      - "SECURITY-ko.md"
      - "CONTRIBUTING.md"
      - "examples/**"
      - "charts/**"
      - "mkdocs.yml"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "README-ko.md"
      - "SECURITY.md"
      - "SECURITY-ko.md"
      - "CONTRIBUTING.md"
      - "examples/**"
      - "charts/**"
      - "mkdocs.yml"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install site dependencies
        run: pip install -r requirements.txt

      # Not --strict yet: migrating off the retired Astro site surfaced a
      # backlog of pre-existing broken relative links inside mirrored
      # upstream content (chart README values-*.yaml links, etc.) that were
      # never validated before. Tracked as follow-up; build must still
      # succeed and every page must still render.
      - name: Build the documentation site
        run: mkdocs build

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Download documentation site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Keep the chart repository's index.yaml and packaged .tgz files that
      # release-chart.yaml publishes to the same gh-pages branch.
      - name: Publish docs without replacing Helm artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
