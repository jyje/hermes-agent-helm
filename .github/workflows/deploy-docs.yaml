name: 📚 deploy-docs

# Publishes to GitHub Pages via the Actions deployment API (build_type:
# workflow), not the legacy branch-based Pages builder. The legacy builder
# sporadically failed with an opaque "Page build failed." error and no
# useful diagnostics, silently leaving the live site stuck on an older
# build. See #139 for the incident that surfaced this.
#
# gh-pages now serves as a plain data store for the Helm chart repository
# (index.yaml + packaged .tgz) that release-chart.yaml publishes there; it
# is no longer the Pages source. This workflow is the only thing that
# actually deploys to Pages, so release-chart.yaml re-triggers it after
# updating that data (see the trigger step at the end of release-chart.yaml).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "README-ko.md"
      - "SECURITY.md"
      - "SECURITY-ko.md"
      - "CONTRIBUTING.md"
      - "examples/**"
      - "charts/**"
      - "mkdocs.yml"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "README-ko.md"
      - "SECURITY.md"
      - "SECURITY-ko.md"
      - "CONTRIBUTING.md"
      - "examples/**"
      - "charts/**"
      - "mkdocs.yml"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deployments share one queue and must not be canceled mid-publish by
# a newer run (that risks a torn/partial deploy); GitHub's own template for
# actions/deploy-pages uses this exact group name and setting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install site dependencies
        run: pip install -r requirements.txt

      - name: Build the documentation site
        env:
          # Suppresses mkdocs-material's own "MkDocs 2.0 is coming" notice,
          # a project announcement unrelated to this build (see
          # material/templates/__init__.py in the installed package) —
          # not one of mkdocs's own WARNING-level diagnostics.
          NO_MKDOCS_2_WARNING: "true"
        # --strict: every link across the site resolves (down from ~250
        # warnings pre-migration to 0, see hooks.py); a future broken link
        # now fails this build instead of silently shipping.
        run: mkdocs build --strict

      - name: Fetch the Helm chart repository data
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-data

      - name: Merge the Helm chart repository into the site output
        run: |
          if [ -f gh-pages-data/index.yaml ]; then
            cp gh-pages-data/index.yaml site/
            cp gh-pages-data/*.tgz site/ 2>/dev/null || true
          else
            echo "::warning::No gh-pages branch data found yet; publishing docs only."
          fi

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
