name: 📚 deploy-docs

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "README.md"
      - "README-ko.md"
      - "docs/**"
      - "examples/**"
      - "charts/**"
      - ".github/workflows/deploy-docs.yaml"
  pull_request:
    paths:
      - "pages/**"
      - "README.md"
      - "README-ko.md"
      - "docs/**"
      - "examples/**"
      - "charts/**"
      - ".github/workflows/deploy-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pages/pnpm-lock.yaml

      - name: Install site dependencies
        run: pnpm -C pages install --frozen-lockfile

      - name: Build the documentation site
        run: pnpm -C pages run build

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: pages/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Download documentation site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: pages/dist

      # Keep the chart repository's index.yaml and packaged .tgz files that
      # release-chart.yaml publishes to the same gh-pages branch.
      - name: Publish docs without replacing Helm artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages/dist
          keep_files: true
