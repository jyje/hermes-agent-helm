name: 🔒 verify-release

# Post-release smoke test that proves the full supply-chain trust chain:
#   1. cosign verify : signature is in the Sigstore transparency log and matches
#                       this repo's GitHub Actions OIDC identity
#   2. helm install  : from the published OCI artifact (not local source files)
#   3. helm test     : hermes doctor + chat round-trip, same as validate-chart
#
# Runs automatically after every successful release-chart run.
# Failure here means the published artifact is broken or the signature is invalid.
#
# release-chart.yaml triggers on any push touching Chart.yaml, including an
# appVersion-only bump - its own tag-existence guard then no-ops (no new tag,
# no new OCI push) and still finishes with conclusion: success. workflow_run
# can't see that guard's result directly (job/step outputs from the
# triggering workflow aren't visible here the way workflow_call would make
# them), so the `check` job below re-derives the same answer independently:
# does the resolved version's tag actually point at this push's commit? If
# not, release-chart no-op'd and there is nothing new to verify.

on:
  workflow_run:
    workflows: ["🚀 release-chart"]
    types: [completed]

permissions:
  packages: read   # pull the signed OCI artifact from ghcr
  contents: read   # read tag refs to detect a no-op release-chart run

jobs:
  check:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04-arm
    outputs:
      should_verify: ${{ steps.tag.outputs.should_verify }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0   # need tag refs, not just this commit

      - name: Check whether release-chart actually published something new
        id: tag
        run: |
          VER="$(grep -E '^version:' charts/hermes-agent/Chart.yaml | awk '{print $2}' | tr -d '"')"
          tag_sha="$(git rev-list -n 1 "refs/tags/v$VER" 2>/dev/null || true)"
          if [ "$tag_sha" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "should_verify=true" >> "$GITHUB_OUTPUT"
            echo "v$VER was tagged at this push - release-chart published something new."
          else
            echo "should_verify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VER's tag doesn't point at this push - release-chart no-op'd (tag already existed). Nothing new to verify."
          fi

  verify:
    needs: check
    if: ${{ needs.check.outputs.should_verify == 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CI_MODELS: "nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning,google/gemma-4-31b-it,openai/gpt-oss-20b"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve chart version
        id: ver
        run: |
          VER="$(grep -E '^version:' charts/hermes-agent/Chart.yaml | awk '{print $2}' | tr -d '"')"
          NAME="$(grep -E '^name:' charts/hermes-agent/Chart.yaml | awk '{print $2}' | tr -d '"')"
          {
            echo "version=$VER"
            echo "chart_name=$NAME"
            echo "image=ghcr.io/${{ github.repository }}/$NAME:$VER"
          } >> "$GITHUB_OUTPUT"
          echo "Verifying release: $NAME v$VER"

      # ── Step 1: verify the cosign signature ─────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify OCI signature (Sigstore)
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${{ steps.ver.outputs.image }}"

      # ── Step 2: install from the verified OCI artifact ──────────────────────
      - uses: azure/setup-helm@v5

      - uses: helm/kind-action@v1

      - name: Log in to ghcr (helm OCI pull)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install from OCI
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            helm upgrade --install hermes-agent \
              "oci://ghcr.io/${{ github.repository }}/${{ steps.ver.outputs.chart_name }}" \
              --version "${{ steps.ver.outputs.version }}" \
              --namespace verify-hermes-chart --create-namespace \
              --set config.model.provider=nvidia \
              --set-string config.model.default="${CI_MODELS%%,*}" \
              --set-string env.NVIDIA_API_KEY="$NVIDIA_API_KEY" \
              --set-string env.OPENAI_API_KEY=unused \
              --set tests.chat.enabled=true \
              --set tests.chat.failOnError=true \
              --set "tests.chat.models={$CI_MODELS}" \
              --wait --timeout 5m
          else
            helm upgrade --install hermes-agent \
              "oci://ghcr.io/${{ github.repository }}/${{ steps.ver.outputs.chart_name }}" \
              --version "${{ steps.ver.outputs.version }}" \
              --namespace verify-hermes-chart --create-namespace \
              --set-string env.OPENAI_API_KEY=sk-test \
              --wait --timeout 5m
          fi

      # ── Step 3: run the chart's own test suite ──────────────────────────────
      - name: Run install test (hermes doctor + chat round-trip)
        timeout-minutes: 6
        run: |
          ns=verify-hermes-chart
          job=hermes-agent-test

          helm get hooks hermes-agent -n "$ns" > /tmp/test-hooks.yaml
          kubectl delete job "$job" -n "$ns" --ignore-not-found
          kubectl create -n "$ns" -f /tmp/test-hooks.yaml

          result=timeout
          for _ in $(seq 1 150); do
            conds=$(kubectl get job "$job" -n "$ns" \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
            case "$conds" in
              *Complete*) result=success; break ;;
              *Failed*)   result=failed;  break ;;
            esac
            sleep 2
          done
          echo "test job result: $result"
          [ "$result" = success ]

      - name: CI comprehensive tests (skill injection + chat via kubectl exec)
        # Conditional extension of the basic helm test: only runs when a model
        # key is available. Reuses the same kind cluster.
        if: env.NVIDIA_API_KEY != ''
        timeout-minutes: 8
        run: |
          set -euo pipefail
          NS=verify-hermes-chart
          # Reuse chat_round_trip from lib.sh instead of a second copy of the
          # same failover loop: an earlier hand-duplicated version here had
          # no per-model timeout, so one hung model (NIM-side, not a chart
          # bug) blocked the whole step instead of failing over.
          . .github/scripts/lib.sh
          pod=$(pod_name)
          echo "Pod: $pod"

          # Inject a test skill via the PVC mount
          echo "=== skill injection ==="
          # shellcheck disable=SC2016  # $HERMES_HOME/$skill_dir expand in the pod's shell, not the runner
          kubectl exec -n "$NS" "$pod" -- sh -c '
            skill_dir="${HERMES_HOME:-/opt/data}/skills"
            mkdir -p "$skill_dir"
            printf "# CI Ping\n\nWhen the user says \"ci-ping\", reply with exactly: CI_PONG\n" \
              > "$skill_dir/ci-test.md"
            echo "Skill written:"
            cat "$skill_dir/ci-test.md"
          '

          echo "=== chat with injected skill ==="
          chat_round_trip "$pod" || { echo "::error::All models failed chat round-trip"; exit 1; }

      - name: Show test logs
        if: always()
        run: |
          kubectl logs -n verify-hermes-chart -l app.kubernetes.io/component=test --tail=-1 || true
          kubectl logs -n verify-hermes-chart -l app.kubernetes.io/name=hermes-agent --tail=-1 || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n verify-hermes-chart -o wide || true
          kubectl describe pods -n verify-hermes-chart || true
          kubectl logs -n verify-hermes-chart -l app.kubernetes.io/component=test --tail=-1 || true
          kubectl logs -n verify-hermes-chart -l app.kubernetes.io/name=hermes-agent --tail=-1 || true
