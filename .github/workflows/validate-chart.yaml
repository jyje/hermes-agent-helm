name: 🔍 validate-chart

on:
  # pull_request only: every merge into main/dev goes through a PR, so the
  # pull_request run already validates the exact tree that lands on the
  # target branch. A push trigger on top of that would re-run the same
  # (expensive, kind-cluster) validation a second time right after merge:
  # e.g. cron-fetch-image's bump-pr gets validated once as a PR (#120) and
  # then again on push to main seconds after merging (#121). Direct pushes
  # bypassing a PR aren't a supported workflow in this repo, so there's no
  # coverage gap in dropping `push`.
  pull_request:
    paths:
      - "charts/hermes-agent/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".changeset/*.cjs"
      - ".github/workflows/validate-chart.yaml"

jobs:
  changes:
    # Detects whether this push/PR only touches Chart.yaml's version (plus the
    # generated docs/changelog that follow it): a release-bump commit. In that
    # case the chart's behavior is unchanged, so the heavy `test` job below
    # (ephemeral kind cluster + real round-trip) is skipped. Exception: an
    # appVersion change swaps the default image, which IS a functional change
    # even when Chart.yaml is the only file touched: that must still run the
    # kind scenarios.
    runs-on: ubuntu-26.04-arm
    outputs:
      functional: ${{ steps.filter.outputs.functional }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "functional=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -vE '^(\.changeset/.*|charts/hermes-agent/(Chart\.yaml|README(-ko)?\.md)|examples/helm/README\.md|CHANGELOG\.md|package\.json|pnpm-lock\.yaml)$' | grep -q .; then
            echo "functional=true" >> "$GITHUB_OUTPUT"
          elif git diff "$base" "${{ github.sha }}" -- charts/hermes-agent/Chart.yaml | grep -qE '^\+appVersion:'; then
            echo "appVersion changed - new default image, running functional tests"
            echo "functional=true" >> "$GITHUB_OUTPUT"
          else
            echo "functional=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: ./.github/actions/install-yq

      - name: helm lint
        run: helm lint charts/hermes-agent --set env.OPENAI_API_KEY=sk-test

      - name: helm template
        run: |
          helm template hermes-agent charts/hermes-agent \
            --set-string env.OPENAI_API_KEY=sk-test > /dev/null

      - name: render values examples
        run: |
          set -euo pipefail
          for values_file in charts/hermes-agent/values-*.yaml; do
            echo "Rendering ${values_file}"
            helm template example charts/hermes-agent -f "$values_file" > /dev/null
          done

      - name: validate paused replica count
        run: |
          # This exact scalar check stays with grep. Use yq for future
          # structured manifest assertions.
          for controller in deployment statefulset; do
            helm template paused charts/hermes-agent \
              --set controller.type="$controller" --set replicaCount=0 \
              --set-string env.OPENAI_API_KEY=sk-test > rendered.yaml
            grep -q '^  replicas: 0$' rendered.yaml
          done
          if helm template invalid charts/hermes-agent \
            --set replicaCount=2 --set-string env.OPENAI_API_KEY=sk-test \
            > /dev/null 2>&1; then
            echo "::error::replicaCount greater than 1 must fail schema validation"
            exit 1
          fi

      - name: validate NetworkPolicy egress
        run: |
          set -euo pipefail
          helm template np charts/hermes-agent \
            --set-string env.OPENAI_API_KEY=sk-test --set networkPolicy.enabled=true \
            --show-only templates/networkpolicy.yaml > np.yaml

          # Cloud metadata endpoint (IPv4 IMDS) blocked.
          yq -e 'select(.kind == "NetworkPolicy").spec.egress[].to[]?.ipBlock.except[]? == "169.254.0.0/16"' np.yaml \
            | grep -q true

          # IPv6 ULA/link-local (where the IMDS equivalent lives) blocked,
          # public IPv6 still reachable via the ::/0 base CIDR.
          yq -e '
            select(.kind == "NetworkPolicy").spec.egress[].to[]? | select(.ipBlock.cidr == "::/0") | .ipBlock.except
          ' np.yaml | grep -q 'fc00::/7'
          yq -e '
            select(.kind == "NetworkPolicy").spec.egress[].to[]? | select(.ipBlock.cidr == "::/0") | .ipBlock.except
          ' np.yaml | grep -q 'fe80::/10'

          # DNS peer scoped to kube-system by default.
          yq -e '
            select(.kind == "NetworkPolicy").spec.egress[].to[]?.namespaceSelector.matchLabels."kubernetes.io/metadata.name" == "kube-system"
          ' np.yaml | grep -q true

          # Ingress denied entirely by default. Helm's `with` renders an
          # empty extraIngress as a null key rather than `[]`; both mean
          # "no rules" to Kubernetes (deny-all under policyTypes: [Ingress]).
          yq -e '((select(.kind == "NetworkPolicy").spec.ingress) // []) | length == 0' np.yaml | grep -q true

          # The LiteLLM example renders and keeps the in-cluster allowance.
          helm template np-litellm charts/hermes-agent \
            -f charts/hermes-agent/values-networkpolicy-litellm.yaml \
            --set-string env.OPENAI_API_KEY=sk-test \
            --show-only templates/networkpolicy.yaml > np-litellm.yaml
          yq -e 'select(.kind == "NetworkPolicy").spec.egress | length > 0' np-litellm.yaml | grep -q true

      - name: validate team-mode config overrides
        # hermes-agent.effectiveConfig (_team.tpl) only fills in a
        # discord.*/group_sessions_per_user default when the user hasn't
        # already set it under `config:` (hermes-agent.setConfigDefault's
        # hasKey guard). This was previously verified by hand-diffing all 28
        # values-*.yaml examples, not by CI - a future edit reintroducing an
        # unconditional overwrite would pass the team kind scenario silently
        # (it runs a doctor/chat round-trip, not a config.yaml content check).
        run: |
          set -euo pipefail
          helm template team-default charts/hermes-agent \
            -f charts/hermes-agent/values-team-leader.yaml \
            --set-string env.OPENAI_API_KEY=sk-test \
            --show-only templates/configmap.yaml > team-default-cm.yaml
          default_val=$(yq '.data."config.yaml"' team-default-cm.yaml | yq '.discord.thread_require_mention')
          if [ "$default_val" != "true" ]; then
            echo "::error::default discord.thread_require_mention should be true, got: $default_val"
            exit 1
          fi

          helm template team-override charts/hermes-agent \
            -f charts/hermes-agent/values-team-leader.yaml \
            --set-string env.OPENAI_API_KEY=sk-test \
            --set config.discord.thread_require_mention=false \
            --show-only templates/configmap.yaml > team-override-cm.yaml
          override_val=$(yq '.data."config.yaml"' team-override-cm.yaml | yq '.discord.thread_require_mention')
          if [ "$override_val" != "false" ]; then
            echo "::error::config: override should win over the team-mode default, got: $override_val"
            exit 1
          fi

      - name: device login unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install release tooling
        run: pnpm install --frozen-lockfile

      - name: changelog category regression test
        # Guards the coupling between .changeset/changelog-category.cjs's
        # bullet format and .github/scripts/release/changelog-categories.mjs's
        # category regex (see both files' comments) - a hand-copied fixture
        # here would miss exactly the drift this exists to catch.
        run: node --test .github/scripts/release/*.test.mjs

      - name: install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          arch=$(uname -m); case "$arch" in aarch64) arch=arm64 ;; esac
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_${arch}.tar.gz" \
            | tar -xz helm-docs
          sudo install helm-docs /usr/local/bin/

      - name: helm-docs is up to date
        run: |
          helm-docs --chart-search-root=charts --template-files=README.md.gotmpl --badge-style=flat
          git diff --exit-code charts/hermes-agent/README.md \
            || { echo "::error::charts/hermes-agent/README.md is stale: run 'make docs' and commit"; exit 1; }

  test:
    # Each matrix entry gets its OWN ephemeral kind cluster (a separate
    # runner), so the scenarios are fully isolated: no shared cluster,
    # no namespace partitioning, no background-process plumbing. Scenario
    # logic lives in .github/scripts/{lib,scenario-*}.sh. If an
    # NVIDIA_API_KEY secret is present (non-fork runs), the message scenario
    # also does a real model round-trip through NVIDIA NIM; otherwise
    # doctor-only. NIM is used (rather than Gemini) because its free tier has
    # enough headroom for repeated CI runs without hitting per-day quota
    # errors.
    #
    # CI_MODELS is a pool of small/free NIM models (same provider/credentials,
    # different model ids). The message scenario tries each via
    # `hermes chat -m <model>` and passes as soon as one succeeds, since any
    # single free-tier model can be flaky: this is a FAILOVER pool, not
    # exhaustive per-model testing.
    needs: changes
    if: needs.changes.outputs.functional == 'true'
    strategy:
      fail-fast: false
      matrix:
        scenario: [message, existing-claim, team, hardened]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      NS: test-hermes-chart
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CI_MODELS: "nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning,google/gemma-4-31b-it,openai/gpt-oss-20b"
      # Optional live Discord verification: only scenario-message.sh ever
      # uses these (it's the only scenario installing Discord), so they're
      # simply unread on the existing-claim job.
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_HOME_CHANNEL: ${{ secrets.DISCORD_HOME_CHANNEL }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: helm/kind-action@v1

      - uses: ./.github/actions/install-yq
        if: matrix.scenario == 'hardened'

      - name: Run ${{ matrix.scenario }} scenario
        timeout-minutes: 12
        run: .github/scripts/scenario-${{ matrix.scenario }}.sh

      - name: Notify Discord and verify delivery (message scenario, trusted runs with a token)
        # Full live round-trip: send a "message scenario verified" notice via `hermes send`
        # from the message-scenario workload (no gateway loop needed for
        # bot-token platforms), then read the channel back through the Discord
        # API and confirm our unique marker is present. This GATES on trusted
        # runs: if the send fails or the message can't be verified, CI fails.
        # Fork PRs skip it (no secret). The bot needs View Channel + Read Message
        # History on DISCORD_HOME_CHANNEL for the read-back. Only this scenario
        # installs Discord, and only this job's own success() is checked: it
        # does not wait on the existing-claim job (GitHub Actions' own check
        # status already reports overall pass/fail across the matrix).
        if: matrix.scenario == 'message' && success() && env.DISCORD_BOT_TOKEN != '' && env.DISCORD_HOME_CHANNEL != ''
        run: |
          set -euo pipefail
          pod=$(kubectl get pod -n test-hermes-chart -l app.kubernetes.io/name=hermes-agent \
            -o jsonpath='{.items[0].metadata.name}')
          nonce="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          msg="✅ hermes-agent chart message scenario verified - other checks still in progress - ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7} [${nonce}]"
          echo "Sending via workload pod: $pod"
          kubectl exec -n test-hermes-chart "$pod" -- hermes send --to discord "$msg"

          echo "Verifying delivery by reading the channel back…"
          ok=false
          for _ in $(seq 1 10); do
            sleep 3
            code=$(curl -sS -o /tmp/discord-msgs.json -w '%{http_code}' \
              -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              "https://discord.com/api/v10/channels/${DISCORD_HOME_CHANNEL}/messages?limit=20" \
              || echo "000")
            if [ "$code" != "200" ]; then
              echo "  read-back HTTP $code (bot needs View Channel + Read Message History); retrying…"
              continue
            fi
            if jq -e --arg n "$nonce" '.[] | select(.content | contains($n))' \
                /tmp/discord-msgs.json >/dev/null 2>&1; then
              ok=true; break
            fi
            echo "  marker not visible yet; retrying…"
          done
          if [ "$ok" != "true" ]; then
            echo "::error::Discord message was sent but could not be verified in the channel"
            exit 1
          fi
          echo "Verified: the CI notification is present in the Discord channel."

      - name: Show test logs
        if: always()
        run: |
          kubectl logs -n test-hermes-chart -l app.kubernetes.io/component=test --tail=-1 || true
          kubectl logs -n test-hermes-chart -l app.kubernetes.io/name=hermes-agent --tail=-1 || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n test-hermes-chart -o wide || true
          kubectl describe pods -n test-hermes-chart || true
          kubectl logs -n test-hermes-chart -l app.kubernetes.io/component=test --tail=-1 || true
          kubectl logs -n test-hermes-chart -l app.kubernetes.io/name=hermes-agent --tail=-1 || true
