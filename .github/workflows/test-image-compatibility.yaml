name: Compare Hermes chart/image compatibility

on:
  push:
    branches:
      - test/issue-313-image-compat-validation

permissions:
  contents: read

jobs:
  persisted-config:
    name: ${{ matrix.chart-line }} / ${{ matrix.image-tag }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    # v1.15.0 is the artifact under investigation. Keep its observed failures
    # visible in the job steps, but do not let an experimental legacy result
    # prevent the post-#305 comparison jobs from completing.
    continue-on-error: ${{ matrix.chart-line == 'published-v1.15.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart-line: published-v1.15.0
            chart-ref: 88447359f5c967b1a03a42b42dccf5746066dc4a
            image-tag: v2026.9.11
          - chart-line: published-v1.15.0
            chart-ref: 88447359f5c967b1a03a42b42dccf5746066dc4a
            image-tag: v2026.9.14
          - chart-line: published-v1.15.0
            chart-ref: 88447359f5c967b1a03a42b42dccf5746066dc4a
            image-tag: v2026.9.21
          - chart-line: post-305-main
            chart-ref: b57d192325b285710bf742853fc2badb31ac43ed
            image-tag: v2026.9.11
          - chart-line: post-305-main
            chart-ref: b57d192325b285710bf742853fc2badb31ac43ed
            image-tag: v2026.9.14
          - chart-line: post-305-main
            chart-ref: b57d192325b285710bf742853fc2badb31ac43ed
            image-tag: v2026.9.21
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v7

      - name: Checkout ${{ matrix.chart-line }} chart source
        uses: actions/checkout@v7
        with:
          repository: jyje/hermes-agent-helm
          ref: ${{ matrix.chart-ref }}
          path: chart-source

      - uses: azure/setup-helm@v5

      - uses: helm/kind-action@v1

      - name: Seed a synthetic partial config into an existing PVC
        env:
          NS: compat-${{ strategy.job-index }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NS"
          cat <<'YAML' | kubectl apply -n "$NS" -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: hermes-existing-home
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: seed-existing-home
          spec:
            restartPolicy: Never
            containers:
              - name: seed
                image: busybox:1.36
                command:
                  - sh
                  - -ec
                  - |
                    mkdir -p /opt/data
                    printf 'model:\n  provider: openai\n  default: gpt-4o-mini\n' > /opt/data/config.yaml
                    printf 'HERMES_COMPAT_TEST_MARKER=synthetic\n' > /opt/data/.env
                    echo 'Seeded partial config without _config_version'
                volumeMounts:
                  - name: data
                    mountPath: /opt/data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: hermes-existing-home
          YAML
          kubectl wait -n "$NS" --for=jsonpath='{.status.phase}'=Succeeded pod/seed-existing-home --timeout=180s
          kubectl logs -n "$NS" seed-existing-home

      - name: Install pinned chart and selected upstream image
        env:
          NS: compat-${{ strategy.job-index }}
          IMAGE_TAG: ${{ matrix.image-tag }}
        run: |
          set -euo pipefail
          helm upgrade --install hermes-agent chart-source/charts/hermes-agent \
            --namespace "$NS" \
            --set persistence.existingClaim=hermes-existing-home \
            --set bootstrap.overwrite=false \
            --set-string image.tag="$IMAGE_TAG" \
            --set-string env.OPENAI_API_KEY=sk-test \
            --wait --timeout 6m

      - name: Assert migrated persisted config and run chart test
        env:
          NS: compat-${{ strategy.job-index }}
          IMAGE_TAG: ${{ matrix.image-tag }}
          CHART_LINE: ${{ matrix.chart-line }}
        run: |
          set -euo pipefail
          pod="$(kubectl get pod -n "$NS" -l app.kubernetes.io/name=hermes-agent \
            -o jsonpath='{.items[0].metadata.name}')"
          echo "Testing image $IMAGE_TAG in pod $pod"
          # shellcheck disable=SC2016 # Variables expand inside the workload pod, not on the runner.
          kubectl exec -n "$NS" "$pod" -- env CHART_LINE="$CHART_LINE" sh -ec '
            config="${HERMES_HOME:-/opt/data}/config.yaml"
            test -s "$config"
            echo "Persisted config after startup migration:"
            sed -n "1,24p" "$config"
            if ! grep -Eq "_config_version:[[:space:]]*[0-9]+" "$config"; then
              if [ "$CHART_LINE" = "published-v1.15.0" ]; then
                echo "::warning::Published v1.15.0 chart did not persist a numeric _config_version in this scenario"
              else
                echo "::error::Post-#305 chart migration did not persist a numeric _config_version"; exit 1
              fi
            fi
            if ! grep -Fq "gpt-4o-mini" "$config"; then
              echo "::error::User model value was not preserved"; exit 1
            fi
            env_file="${HERMES_HOME:-/opt/data}/.env"
            marker="HERMES_COMPAT_TEST_MARKER=synthetic"
            if ! grep -Fq "$marker" "$env_file"; then
              backup="$(find "${HERMES_HOME:-/opt/data}/backups/config" -maxdepth 1 \
                -type f -name ".env.pre-chart-migrate.*" -print -quit 2>/dev/null || true)"
              if [ "$CHART_LINE" = "post-305-main" ] && { [ -z "$backup" ] || ! grep -Fq "$marker" "$backup"; }; then
                echo "::error::.env marker is missing from both active config and migration backup"; exit 1
              fi
              if [ -n "$backup" ] && grep -Fq "$marker" "$backup"; then
                echo "Unknown .env marker was retained in backup: $backup"
              else
                echo "::warning::Legacy chart did not retain the synthetic .env marker in an active file or chart migration backup"
              fi
            fi
            echo "Persisted config checks completed; user model value is present"
          '
          helm test hermes-agent --namespace "$NS" --timeout 5m

      - name: Diagnostics on failure
        if: failure()
        env:
          NS: compat-${{ strategy.job-index }}
        run: |
          kubectl get pods -n "$NS" -o wide || true
          kubectl describe pods -n "$NS" || true
          kubectl logs -n "$NS" -l app.kubernetes.io/name=hermes-agent -c seed-config --tail=-1 || true
          kubectl logs -n "$NS" -l app.kubernetes.io/name=hermes-agent --all-containers --tail=-1 || true
          kubectl logs -n "$NS" -l app.kubernetes.io/component=test --all-containers --tail=-1 || true
