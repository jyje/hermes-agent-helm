name: 📋 propose-release

# A Changeset records the release intent with the change that needs it. A
# maintainer starts this workflow when it is time to prepare a release; it then
# consumes all pending entries into one reviewable release PR. The custom
# version command keeps the private npm release manifest, Chart.yaml, Artifact
# Hub changes, chart README, and examples on the same version. Nothing is
# published here; release-chart.yaml publishes only after this PR merges to
# main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-release
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-26.04-arm
    steps:
      # Use the repository App identity for the push/PR, so the validation PR
      # is treated as trusted rather than requiring a per-run bot approval.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install release tooling
        run: pnpm --filter @jyje/hermes-agent-helm install --frozen-lockfile

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          arch=$(uname -m); case "$arch" in aarch64) arch=arm64 ;; esac
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_${arch}.tar.gz" \
            | tar -xz helm-docs
          sudo install helm-docs /usr/local/bin/

      - name: Create or update the Changesets release PR
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          commit: "🔧 chore(release): propose chart version"
          title: "🚀 release(hermes-agent): version chart"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
