name: 📋 propose-release

# A Changeset records the release intent with the change that needs it. A
# maintainer starts this workflow when it is time to prepare a release; it then
# consumes all pending entries into one reviewable release PR. The custom
# version command keeps the private npm release manifest, Chart.yaml, Artifact
# Hub changes, chart README, and examples on the same version. Nothing is
# published here; release-chart.yaml publishes only after this PR merges to
# main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_PACKAGE: "@jyje/hermes-agent-helm"

concurrency:
  group: propose-release
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-26.04-arm
    steps:
      # Use the repository App identity for the push/PR, so the validation PR
      # is treated as trusted rather than requiring a per-run bot approval.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install release tooling
        run: pnpm --filter @jyje/hermes-agent-helm install --frozen-lockfile

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          arch=$(uname -m); case "$arch" in aarch64) arch=arm64 ;; esac
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_${arch}.tar.gz" \
            | tar -xz helm-docs
          sudo install helm-docs /usr/local/bin/

      - name: Calculate release version
        id: release-version
        run: |
          pnpm changeset status --output /tmp/changeset-status.json
          version="$(node -e '
            const status = require("/tmp/changeset-status.json");
            const release = status.releases.find(({ name }) => name === process.argv[1]);
            console.log(release?.newVersion ?? "");
          ' "$RELEASE_PACKAGE")"
          if [ -z "$version" ]; then
            echo "No pending Changesets; no release PR to create or update."
            echo "has-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Preparing chart release v$version"
          echo "has-release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or update the Changesets release PR
        if: steps.release-version.outputs.has-release == 'true'
        # Pinned to an exact v1.x release, not the floating `@v2` major tag:
        # changesets/action v2 requires Changesets CLI v3, and this repo's
        # release tooling (package.json's @changesets/cli, and the custom
        # changelog module in .changeset/) is built against CLI v2. `@v2`
        # silently resolved to v2.1.1 and broke every propose-release run
        # with "This version of the Changesets action is designed to work
        # with Changesets CLI v3" - v1.x is the CLI-v2-compatible line.
        uses: changesets/action@v2.1.1
        with:
          # v1.9.0's input names (version/commit/title), not v2's
          # (version-script/commit-message/pr-title) - passing the v2 names
          # here silently no-ops: the action logs "Unexpected input(s)" and
          # skips creating/updating the release PR instead of failing loudly.
          version: pnpm release:version
          commit: "🚀 chore(release): propose chart v${{ steps.release-version.outputs.version }}"
          title: "🚀 release(hermes-agent): v${{ steps.release-version.outputs.version }}"
          github-token: ${{ steps.app-token.outputs.token }}
