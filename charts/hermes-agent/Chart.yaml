apiVersion: v2
name: hermes-agent
description: |
  👩🏻‍💻 A Helm chart to run Hermes Agent on Kubernetes, community-powered, lightweight
  
  Run [Hermes Agent](https://github.com/NousResearch/hermes-agent) - a multi-provider LLM agent framework - on Kubernetes. Configure any provider Hermes supports (OpenAI, Anthropic, Gemini, OpenRouter, NVIDIA, or any OpenAI-compatible proxy such as LiteLLM/vLLM) entirely via values.yaml, with a built-in helm test health check.
type: application

icon: https://hermes-agent.nousresearch.com/docs/img/logo.png

# Chart version (bump on chart changes).
version: 1.5.0

# Upstream Hermes Agent image version this chart targets by default.
# Date-based tag; corresponds to Hermes Agent v0.16.0 (2026.6.5).
appVersion: "v2026.8.13"

keywords:
  - hermes
  - agent
  - llm
  - openai-compatible

home: https://github.com/jyje/hermes-agent-helm
sources:
  - https://github.com/jyje/hermes-agent-helm
  - https://github.com/NousResearch/hermes-agent
maintainers:
  - name: jyje
    email: jyjeon@outlook.com

# Artifact Hub metadata (for future publishing to artifacthub.io).
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: "fixed"
      description: "Documentation(values): Add SOUL identity example Provide a ready-to-adapt values overlay for a durable Hermes identity and safe bootstrap preservation."
    - kind: "added"
      description: "Update the default Hermes Agent image to v2026.8.13."
    - kind: "added"
      description: "Feature(config): Seed SOUL.md alongside config.yaml Configure a persistent Hermes identity that the chart seeds into HERMES_HOME."
    - kind: "added"
      description: "Feature(values): Startup probes and controller annotations Configure a startup probe and annotations on Deployment or StatefulSet resources."
