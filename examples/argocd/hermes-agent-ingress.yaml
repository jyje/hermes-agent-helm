# Mirrors charts/hermes-agent/values-ingress.yaml: OpenAI (api.openai.com)
# with the management dashboard exposed via Ingress and signed in with the
# dashboard's own username/password provider.
#
# The dashboard fails closed without an auth provider, so the credentials are
# part of the release, not an nginx layer in front of it. Upstream recommends
# the password provider only for a trusted network or a VPN. For a public host
# use values-ingress-oauth.yaml or values-ingress-oidc.yaml instead (see the
# README, "Expose the dashboard").
#
# Needs a chart release that has the `dashboard` values (after 1.16.0).
#
# Before applying, create the Secret this Application references. It holds the
# API key and the dashboard credentials, so none of them is committed:
#   kubectl create secret generic hermes-agent-ingress-secrets -n hermes-agent \
#     --from-literal=OPENAI_API_KEY='sk-<real>' \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_USERNAME='admin' \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_PASSWORD='<your-password>' \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_SECRET="$(openssl rand -base64 32)"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # KEEP IT EQUAL TO spec.source.helm.releaseName below.
  name: hermes-agent-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/jyje/hermes-agent-helm
    chart: hermes-agent
    # "*" tracks the latest published chart version (semver range supported
    # for Helm/OCI sources). Pin to an exact version (e.g. "0.1.1") for
    # reproducible/controlled upgrades.
    targetRevision: "*"
    helm:
      # MUST equal metadata.name (see examples/argocd/README.md).
      releaseName: hermes-agent-ingress
      valuesObject:
        config:
          model:
            provider: openai-api
            default: gpt-4o-mini
          terminal:
            backend: local
        # Real key comes from the Secret via extraEnvFrom below; this
        # placeholder is never used.
        env:
          OPENAI_API_KEY: "set-via-extraEnvFrom"
        extraEnvFrom:
          - secretRef:
              name: hermes-agent-ingress-secrets
        dashboard:
          enabled: true
          auth:
            # The credentials come from the Secret through extraEnvFrom, which
            # the chart cannot inspect at render time, hence "external".
            provider: external
          # Behind a TLS-terminating Ingress also list the controller here (and
          # set ingress.tls below), or the session cookies lose Secure. List the
          # node network and the pod network for a host-network controller.
          # trustedProxies:
          #   - "10.244.0.0/16"
        service:
          enabled: true
          type: ClusterIP
          port: 9119
        ingress:
          enabled: true
          className: nginx
          annotations: {}
          hosts:
            - host: hermes-agent.example.com
              paths:
                - path: /
                  pathType: Prefix
          tls: []
          #  - secretName: hermes-agent-tls
          #    hosts:
          #      - hermes-agent.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-agent
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
