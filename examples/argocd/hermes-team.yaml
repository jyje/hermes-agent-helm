# One ApplicationSet generates the leader and every member of a Discord team.
# The roster, shared skill, and shared-volume policy are declared once in the
# template below. Per-agent list entries contain only identity, role, and the
# Secret holding that bot's private credentials.
#
# The leader entry is the sole owner of two shared resources:
#   - hermes-team-skill: one generated team roster/protocol ConfigMap
#   - hermes-team-knowledge: one RWX durable-knowledge PVC
# Members mount both by name and never create private copies. The skill and PVC
# are read-only in member Pods; only the leader can curate shared knowledge.
# Discord remains the visible task/result coordination plane.
#
# Before applying:
#   1. Ensure the cluster default StorageClass supports ReadWriteMany, or set
#      team.sharedVolume.storageClass below to an RWX-capable class.
#   2. Create a common Secret containing public routing identifiers as env vars:
#        DISCORD_HOME_CHANNEL, DISCORD_ALLOWED_USERS,
#        AUGUST_BOT_USER_ID, MAY_BOT_USER_ID, MARCH_BOT_USER_ID
#      The values are deployment data even when not API credentials; do not put
#      real cluster-specific identifiers in this public example.
#   3. Create one private Secret per agent. Each contains its provider key and
#      its own DISCORD_BOT_TOKEN. The names are listed under botSecret below.
#   4. Invite all bots to the same Discord channel and enable Message Content
#      Intent for every bot.
#
# Pin targetRevision to an exact chart version in production.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hermes-team
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: august
            teamRole: leader
            valuesProfile: leader
            ownsSharedResources: "true"
            botSecret: hermes-august-discord-secrets
          - name: may
            teamRole: member
            valuesProfile: member
            ownsSharedResources: "false"
            botSecret: hermes-may-discord-secrets
          - name: march
            teamRole: member
            valuesProfile: member
            ownsSharedResources: "false"
            botSecret: hermes-march-discord-secrets
  template:
    metadata:
      name: 'hermes-{{ .name }}'
    spec:
      project: default
      source:
        repoURL: ghcr.io/jyje/hermes-agent-helm
        chart: hermes-agent
        targetRevision: "*"
        helm:
          releaseName: 'hermes-{{ .name }}'
          valueFiles:
            - 'values-team-{{ .valuesProfile }}.yaml'
          # Keep this as a string rather than valuesObject: ApplicationSet's
          # Go template can safely render per-agent scalar fields inside it.
          # The roster and shared policy are written once for the entire set.
          values: |
            fullnameOverride: 'hermes-{{ .name }}'

            team:
              enabled: true
              name: hermes-team
              role: '{{ .teamRole }}'
              identity: '{{ .name }}'
              leader:
                name: august
                mentionEnv: AUGUST_BOT_USER_ID
              members:
                - name: may
                  role: Research and evidence gathering
                  mentionEnv: MAY_BOT_USER_ID
                  capabilities: [research, source-review]
                - name: march
                  role: Implementation and verification
                  mentionEnv: MARCH_BOT_USER_ID
                  capabilities: [implementation, testing]
              protocol:
                maxHandoffs: 6
              skill:
                enabled: true
                create: {{ .ownsSharedResources }}
                name: hermes-team-roster
                configMapName: hermes-team-skill
                extraInstructions: ""
              sharedVolume:
                enabled: true
                create: {{ .ownsSharedResources }}
                claimName: hermes-team-knowledge
                mountPath: /opt/data/team-knowledge
                storageClass: ""
                accessModes: [ReadWriteMany]
                size: 10Gi
                retain: true
                permissions:
                  enabled: {{ .ownsSharedResources }}
                  image: busybox:1.37
                  uid: 10000
                  gid: 10000

            # Remove the dummy IDs from the packaged examples. The common
            # Secret supplies the complete roster to every generated release.
            extraEnv: []
            extraEnvFrom:
              - secretRef:
                  name: hermes-team-routing
              - secretRef:
                  name: '{{ .botSecret }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: hermes-team
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
